name: Release Validation

on:
    pull_request:
    push:
        branches:
            - main
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    cross-platform:
        name: Bun 1.3.14 / ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                os:
                    - macos-latest
                    - ubuntu-latest
                    - windows-latest
        env:
            GITHUB_TOKEN: ''
            TARGET_PATH: ''
        steps:
            - name: Check out repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: 1.3.14

            - name: Install locked dependencies
              run: bun install --frozen-lockfile

            - name: Run quality and representative archive gates
              run: bun run smoke:qc

            - name: Build bundled CLI
              run: bun run build

            # The published bin and library entry are these bundles, and npx and npm consumers
            # load them under node. Exercising both with the runner's own node is what keeps
            # `npx starsync` and `import 'starsync'` from regressing whenever a bun-only API
            # sneaks into src.
            - name: Run bundled CLI and library under node
              run: |
                  node --version
                  node dist/cli.js --help
                  node dist/cli.js sync --help
                  node dist/cli.js verify --help
                  node -e "import('./dist/index.js').then((m) => { if (typeof m.syncArchive !== 'function') { throw new Error('library entry did not export syncArchive'); } })"

            - name: Compile platform executable
              run: bun run compile
